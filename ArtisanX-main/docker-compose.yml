# ============================================================
# KALASETU - DEVELOPMENT DOCKER COMPOSE
# ============================================================

services:

  # ==========================================================
  # POSTGRESQL DATABASE
  # ==========================================================

  postgres:
    image: postgres:16

    container_name: kalasetu_postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: kalasetu
      POSTGRES_PASSWORD: kalasetu_password
      POSTGRES_DB: kalasetu_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalasetu -d kalasetu_db"]
      interval: 5s
      timeout: 5s
      retries: 5


  # ==========================================================
  # FASTAPI BACKEND
  # ==========================================================

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: kalasetu_backend

    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql+psycopg://kalasetu:kalasetu_password@postgres:5432/kalasetu_db

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./backend:/app


# ============================================================
# VOLUMES
# ============================================================

volumes:
  postgres_data: